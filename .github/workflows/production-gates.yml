.name: production-gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      BACKEND_URL: http://127.0.0.1:3001
      HMAC_SIGNING_SECRET: ci-hmac-signing-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 &
          npx --yes wait-on@8.0.2 http://127.0.0.1:3000/en
      - name: Lighthouse budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:3000/en
          budgetPath: Frontend/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avion
      DATABASE_POOL_MAX: 5
      DATABASE_IDLE_TIMEOUT_MS: 10000
      DATABASE_CONNECTION_TIMEOUT_MS: 5000
      DATABASE_STATEMENT_TIMEOUT_MS: 5000
      HMAC_SIGNING_SECRET: ci-hmac-signing-secret-at-least-32-chars
      ALLOWED_ORIGINS: http://127.0.0.1:3000
      DUFFEL_API_TOKEN: test-token
      DUFFEL_API_VERSION: v2
      DUFFEL_API_BASE_URL: https://api.duffel.com
      DUFFEL_SUPPLIER_TIMEOUT_MS: 20000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm audit --audit-level=high
