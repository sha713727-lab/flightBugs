services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avion}
      POSTGRES_USER: ${POSTGRES_USER:-avion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - avion_pg_data:/var/lib/postgresql
    networks:
      - avion_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-avion}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-avion}
    command: ["npm", "run", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - avion_internal

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-avion}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-avion}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - avion_internal
    expose:
      - "3001"

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        BACKEND_URL: http://backend:3001
        HMAC_SIGNING_SECRET: ${HMAC_SIGNING_SECRET:?set HMAC_SIGNING_SECRET}
    restart: unless-stopped
    env_file:
      - ./Frontend/.env
    environment:
      BACKEND_URL: http://backend:3001
      HMAC_SIGNING_SECRET: ${HMAC_SIGNING_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    depends_on:
      - backend
    networks:
      avion_internal:
        aliases:
          - flightbugs_frontend
    expose:
      - "3000"

  proxy:
    image: nginx:1.27.4-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "127.0.0.1:${AVION_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/avion.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - avion_internal
      - edge_proxy

networks:
  avion_internal:
    driver: bridge
  edge_proxy:
    name: aviosupportdesk_avion
    external: true

volumes:
  avion_pg_data:
